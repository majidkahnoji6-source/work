<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ثبت نصب کولر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef3f4;
    --surface: #ffffff;
    --ink: #14282b;
    --muted: #5d7377;
    --line: #cfdcde;
    --accent: #0b7a85;
    --accent-ink: #ffffff;
    --accent-soft: #dcf0f2;
    --danger: #b3261e;
    --ok: #1b7a3d;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1b1d;
      --surface: #172629;
      --ink: #e6f1f2;
      --muted: #93adb1;
      --line: #2b4246;
      --accent: #3cc3cf;
      --accent-ink: #062226;
      --accent-soft: #1b3a3e;
      --danger: #ff8a80;
      --ok: #6fd98f;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'Vazirmatn', Tahoma, 'Segoe UI', sans-serif;
    font-size: 16px; line-height: 1.7;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 120px; }
  header { padding: 28px 0 14px; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }

  fieldset { border: 0; padding: 0; margin: 0 0 22px; }
  legend {
    font-weight: 700; font-size: 15px; padding: 0 0 8px; margin-bottom: 4px;
    border-bottom: 2px solid var(--accent); width: 100%;
  }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .full { grid-column: 1 / -1; }
  label.f { display: block; font-size: 14px; font-weight: 500; margin-bottom: 4px; }
  input[type=text], input[type=tel], input[type=password], textarea {
    width: 100%; font: inherit; color: var(--ink); background: var(--surface);
    border: 1.5px solid var(--line); border-radius: var(--radius);
    padding: 11px 12px; min-height: 48px;
  }
  textarea { min-height: 84px; resize: vertical; }
  input:focus, textarea:focus, button:focus-visible, .opt input:focus-visible + span, .photo:focus-within {
    outline: 3px solid var(--accent); outline-offset: 1px;
  }
  input.num { direction: ltr; text-align: right; letter-spacing: .5px; }
  .err { color: var(--danger); font-size: 13px; min-height: 0; margin-top: 3px; }
  .invalid { border-color: var(--danger) !important; }

  .opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .opt { position: relative; }
  .opt input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .opt span {
    display: block; min-width: 76px; text-align: center; padding: 10px 14px;
    border: 1.5px solid var(--line); border-radius: var(--radius);
    background: var(--surface); font-weight: 500;
  }
  .opt input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .opt input:disabled + span { opacity: .35; text-decoration: line-through; }
  .opt input:disabled { cursor: not-allowed; }
  .hint { font-size: 13px; color: var(--muted); margin-top: 6px; }

  .photos { display: grid; gap: 12px; }
  .photo {
    display: flex; align-items: center; gap: 12px; background: var(--surface);
    border: 1.5px dashed var(--line); border-radius: var(--radius); padding: 10px; cursor: pointer;
  }
  .photo.has { border-style: solid; border-color: var(--accent); }
  .photo.invalid { border-color: var(--danger); }
  .photo input { display: none; }
  .thumb {
    width: 72px; height: 72px; flex: none; border-radius: 8px; background: var(--accent-soft);
    background-size: cover; background-position: center; display: grid; place-items: center;
    color: var(--accent); font-size: 28px;
  }
  .photo b { display: block; font-size: 15px; }
  .photo small { color: var(--muted); font-size: 13px; }

  .bar {
    position: fixed; inset: auto 0 0 0; background: var(--surface);
    border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  }
  .bar .in { max-width: 560px; margin: 0 auto; }
  button.go {
    width: 100%; min-height: 52px; font: inherit; font-weight: 700; font-size: 17px;
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: var(--radius); cursor: pointer;
  }
  button.go:disabled { opacity: .6; cursor: wait; }
  .status { text-align: center; font-size: 14px; margin-bottom: 8px; min-height: 0; }
  .status.bad { color: var(--danger); }

  .done { text-align: center; padding: 60px 0; }
  .done .tick { font-size: 56px; color: var(--ok); }
  .done h2 { margin: 6px 0; }
  .done button { margin-top: 18px; }
  details.chg { margin: 8px 0 24px; background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--radius); padding: 0 14px; }
  details.chg summary { cursor: pointer; padding: 14px 0; font-weight: 700; font-size: 15px; }
  details.chg .body { padding: 0 0 14px; display: grid; gap: 10px; }
  button.sec {
    min-height: 46px; font: inherit; font-weight: 700; background: transparent; color: var(--accent);
    border: 1.5px solid var(--accent); border-radius: var(--radius); cursor: pointer;
  }
  button.sec:disabled { opacity: .6; cursor: wait; }
  .msg { font-size: 14px; min-height: 0; }
  .msg.bad { color: var(--danger); } .msg.good { color: var(--ok); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ثبت نصب کولر</h1>
    <p>مشخصات مشتری، دستگاه و عکس‌های نصب</p>
  </header>

  <form id="form" novalidate autocomplete="off">
    <fieldset>
      <legend>رمز ثبت</legend>
      <label class="f" for="accessCode">رمز (فقط یک‌بار وارد می‌شود و روی این دستگاه ذخیره می‌ماند)</label>
      <input type="password" id="accessCode" class="num" autocomplete="off">
      <div class="err" data-for="accessCode"></div>
    </fieldset>

    <fieldset>
      <legend>مشخصات خریدار</legend>
      <div class="grid">
        <div>
          <label class="f" for="firstName">نام</label>
          <input type="text" id="firstName" autocomplete="given-name">
          <div class="err" data-for="firstName"></div>
        </div>
        <div>
          <label class="f" for="lastName">نام خانوادگی</label>
          <input type="text" id="lastName" autocomplete="family-name">
          <div class="err" data-for="lastName"></div>
        </div>
        <div>
          <label class="f" for="phone">شماره تماس</label>
          <input type="tel" id="phone" class="num" inputmode="numeric" maxlength="11" placeholder="09123456789">
          <div class="err" data-for="phone"></div>
        </div>
        <div>
          <label class="f" for="nationalCode">کد ملی</label>
          <input type="tel" id="nationalCode" class="num" inputmode="numeric" maxlength="10">
          <div class="err" data-for="nationalCode"></div>
        </div>
        <div class="full">
          <label class="f" for="address">آدرس</label>
          <textarea id="address"></textarea>
          <div class="err" data-for="address"></div>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>مشخصات نصب و دستگاه</legend>
      <div class="grid">
        <div class="full">
          <label class="f" for="installDate">تاریخ نصب (شمسی)</label>
          <input type="tel" id="installDate" class="num" inputmode="numeric" placeholder="1405/01/01" maxlength="10">
          <div class="err" data-for="installDate"></div>
        </div>
        <div class="full">
          <span class="f" style="display:block;font-size:14px;font-weight:500;margin-bottom:4px">ظرفیت</span>
          <div class="opts" id="capOpts"></div>
          <div class="err" data-for="capacity"></div>
        </div>
        <div class="full">
          <span class="f" style="display:block;font-size:14px;font-weight:500;margin-bottom:4px">مدل</span>
          <div class="opts" id="modelOpts"></div>
          <div class="hint" id="modelHint" hidden>مدل Down برای ظرفیت ۶۰۰۰ و ۸۰۰۰ وجود ندارد.</div>
          <div class="err" data-for="model"></div>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>عکس‌ها</legend>
      <div class="photos" id="photos"></div>
    </fieldset>
    <details class="chg" id="chg">
      <summary>تغییر رمز ثبت</summary>
      <div class="body">
        <div>
          <label class="f" for="curCode">رمز فعلی (اگر هنوز رمزی تعیین نشده، خالی بگذارید)</label>
          <input type="password" id="curCode" class="num" autocomplete="off">
        </div>
        <div>
          <label class="f" for="newCode">رمز جدید (حداقل ۶ کاراکتر)</label>
          <input type="password" id="newCode" class="num" autocomplete="off">
        </div>
        <div>
          <label class="f" for="newCode2">تکرار رمز جدید</label>
          <input type="password" id="newCode2" class="num" autocomplete="off">
        </div>
        <div class="msg" id="chgMsg"></div>
        <button type="button" class="sec" id="chgBtn">ذخیره رمز جدید</button>
      </div>
    </details>
  </form>

  <section class="done" id="done" hidden>
    <div class="tick">✓</div>
    <h2>ثبت شد</h2>
    <p id="doneMsg" style="color:var(--muted)"></p>
    <button class="go" id="again" type="button">ثبت نصب جدید</button>
  </section>
</div>

<div class="bar" id="bar">
  <div class="in">
    <div class="status" id="status"></div>
    <button class="go" id="submit" type="button">ثبت اطلاعات</button>
  </div>
</div>

<script>
(function () {
  // آدرس برنامه‌ی Apps Script (بعد از Deploy) را اینجا بگذارید:
  const API_URL = 'https://script.google.com/macros/s/AKfycby7sAnI9QSZizspEZ_k2fDEzFiMKJH1h2i_DJBbba1Louy7gqq2Xa8X3YKzef0-uUKf/exec';

  const CAPS = { '6000': ['up','front'], '8000': ['up','front'],
                 '15000': ['up','front','down'], '18000': ['up','front','down'], '30000': ['up','front','down'] };
  const MODEL_LABEL = { up: 'Up', front: 'Front', down: 'Down' };
  const PHOTOS = [
    { key: 'photoPlate',    title: 'عکس پلاک دستگاه',        sub: 'برچسب مشخصات روی دستگاه' },
    { key: 'photoOverview', title: 'نمای کلی بعد از نصب',   sub: 'کل دستگاه نصب‌شده' },
    { key: 'photoWarranty', title: 'برگه گارانتی',           sub: 'کل برگه خوانا باشد' }
  ];
  const $ = id => document.getElementById(id);
  const state = { capacity: '', model: '', photos: {} };

  /* ---------- ارقام ---------- */
  function latin(s) {
    return String(s || '').replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
                          .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
  }
  function faNum(s) { return String(s).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]); }
  ['phone','nationalCode','installDate'].forEach(id => {
    $(id).addEventListener('input', e => { e.target.value = latin(e.target.value).replace(/[^\d/]/g, ''); });
  });

  /* ---------- رمز ثبت ---------- */
  try { $('accessCode').value = localStorage.getItem('accessCode') || ''; } catch (e) {}

  /* ---------- تاریخ امروز شمسی ---------- */
  function todayJalali() {
    try {
      const p = new Intl.DateTimeFormat('en-US-u-ca-persian-nu-latn', { year:'numeric', month:'2-digit', day:'2-digit' })
        .formatToParts(new Date()).reduce((a, x) => (a[x.type] = x.value, a), {});
      return p.year + '/' + p.month + '/' + p.day;
    } catch (e) { return ''; }
  }
  $('installDate').value = todayJalali();

  /* ---------- ظرفیت و مدل ---------- */
  function renderCaps() {
    const box = $('capOpts'); box.innerHTML = '';
    Object.keys(CAPS).forEach(c => {
      const l = document.createElement('label'); l.className = 'opt';
      l.innerHTML = '<input type="radio" name="cap" value="' + c + '"><span>' + faNum(c) + '</span>';
      l.querySelector('input').addEventListener('change', () => { state.capacity = c; renderModels(); clearErr('capacity'); });
      box.appendChild(l);
    });
  }
  function renderModels() {
    const box = $('modelOpts'); box.innerHTML = '';
    const allowed = CAPS[state.capacity] || [];
    if (allowed.indexOf(state.model) === -1) state.model = '';
    ['up','front','down'].forEach(m => {
      const l = document.createElement('label'); l.className = 'opt';
      const dis = state.capacity && allowed.indexOf(m) === -1;
      l.innerHTML = '<input type="radio" name="model" value="' + m + '"' + (dis ? ' disabled' : '') +
                    (state.model === m ? ' checked' : '') + '><span>' + MODEL_LABEL[m] + '</span>';
      l.querySelector('input').addEventListener('change', () => { state.model = m; clearErr('model'); });
      box.appendChild(l);
    });
    $('modelHint').hidden = !(state.capacity && allowed.indexOf('down') === -1);
  }
  renderCaps(); renderModels();

  /* ---------- عکس‌ها (فشرده‌سازی قبل از ارسال) ---------- */
  function compress(file, maxSide, quality) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        let w = img.naturalWidth, h = img.naturalHeight;
        const k = Math.min(1, maxSide / Math.max(w, h));
        w = Math.round(w * k); h = Math.round(h * k);
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        const dataUrl = cv.toDataURL('image/jpeg', quality);
        URL.revokeObjectURL(url);
        resolve({ data: dataUrl.split(',')[1], mime: 'image/jpeg', preview: dataUrl });
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('خواندن عکس ممکن نیست')); };
      img.src = url;
    });
  }
  function renderPhotos() {
    const box = $('photos'); box.innerHTML = '';
    PHOTOS.forEach(p => {
      const l = document.createElement('label'); l.className = 'photo'; l.id = 'ph_' + p.key;
      l.innerHTML = '<input type="file" accept="image/*"><div class="thumb">📷</div>' +
                    '<div><b>' + p.title + '</b><small>' + p.sub + '</small></div>';
      const inp = l.querySelector('input'), th = l.querySelector('.thumb');
      inp.addEventListener('change', async () => {
        const f = inp.files && inp.files[0]; if (!f) return;
        th.textContent = '…';
        try {
          const r = await compress(f, 1600, 0.78);
          state.photos[p.key] = { data: r.data, mime: r.mime };
          th.textContent = ''; th.style.backgroundImage = 'url(' + r.preview + ')';
          l.classList.add('has'); l.classList.remove('invalid');
        } catch (e) { th.textContent = '📷'; setStatus(e.message, true); }
      });
      box.appendChild(l);
    });
  }
  renderPhotos();

  /* ---------- اعتبارسنجی ---------- */
  function validNC(c) {
    if (!/^\d{10}$/.test(c) || /^(\d)\1{9}$/.test(c)) return false;
    let s = 0; for (let i = 0; i < 9; i++) s += +c[i] * (10 - i);
    const r = s % 11; return r < 2 ? +c[9] === r : +c[9] === 11 - r;
  }
  function setErr(k, msg) {
    const e = document.querySelector('[data-for="' + k + '"]'); if (e) e.textContent = msg;
    const f = $(k); if (f) f.classList.add('invalid');
  }
  function clearErr(k) {
    const e = document.querySelector('[data-for="' + k + '"]'); if (e) e.textContent = '';
    const f = $(k); if (f) f.classList.remove('invalid');
  }
  function validate() {
    let first = null;
    const bad = (k, m) => { setErr(k, m); if (!first) first = $(k) || document.querySelector('[data-for="' + k + '"]'); };
    ['accessCode','firstName','lastName','phone','nationalCode','address','installDate','capacity','model'].forEach(clearErr);
    document.querySelectorAll('.photo').forEach(p => p.classList.remove('invalid'));

    if (!$('accessCode').value.trim()) bad('accessCode', 'رمز ثبت را وارد کنید');
    if (!$('firstName').value.trim()) bad('firstName', 'نام را وارد کنید');
    if (!$('lastName').value.trim()) bad('lastName', 'نام خانوادگی را وارد کنید');
    if (!/^09\d{9}$/.test($('phone').value)) bad('phone', 'شماره ۱۱ رقمی و با ۰۹ شروع شود');
    if (!validNC($('nationalCode').value)) bad('nationalCode', 'کد ملی معتبر نیست');
    if (!$('address').value.trim()) bad('address', 'آدرس را وارد کنید');
    if (!/^\d{4}\/\d{1,2}\/\d{1,2}$/.test($('installDate').value)) bad('installDate', 'مثال: 1405/01/15');
    if (!state.capacity) bad('capacity', 'ظرفیت را انتخاب کنید');
    if (!state.model) bad('model', 'مدل را انتخاب کنید');
    PHOTOS.forEach(p => {
      if (!state.photos[p.key]) {
        $('ph_' + p.key).classList.add('invalid');
        if (!first) first = $('ph_' + p.key);
      }
    });
    if (first) { first.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    return !first;
  }

  /* ---------- ارسال ---------- */
  function setStatus(msg, bad) { const s = $('status'); s.textContent = msg || ''; s.classList.toggle('bad', !!bad); }

  $('submit').addEventListener('click', () => {
    setStatus('');
    if (!validate()) { setStatus('موارد مشخص‌شده را کامل کنید', true); return; }
    const btn = $('submit'); btn.disabled = true; btn.textContent = 'در حال ارسال…';
    setStatus('عکس‌ها در حال آپلود است؛ صفحه را نبندید');
    const payload = {
      accessCode: $('accessCode').value.trim(),
      firstName: $('firstName').value, lastName: $('lastName').value,
      phone: $('phone').value, nationalCode: $('nationalCode').value,
      address: $('address').value, installDate: $('installDate').value,
      capacity: state.capacity, model: state.model,
      photoPlate: state.photos.photoPlate, photoOverview: state.photos.photoOverview,
      photoWarranty: state.photos.photoWarranty
    };
    const fail = msg => {
      btn.disabled = false; btn.textContent = 'ثبت اطلاعات';
      setStatus(msg + ' — دوباره تلاش کنید', true);
    };
    if (API_URL.indexOf('http') !== 0) { fail('آدرس API در فایل تنظیم نشده است'); return; }

    // text/plain باعث می‌شود مرورگر درخواست پیش‌پرواز (CORS preflight) نفرستد
    fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    })
      .then(r => r.json())
      .then(res => {
        if (!res.ok) { fail(res.error || 'خطا در ثبت'); return; }
        try { localStorage.setItem('accessCode', payload.accessCode); } catch (e) {}
        btn.disabled = false; btn.textContent = 'ثبت اطلاعات'; setStatus('');
        $('form').hidden = true; $('bar').hidden = true; $('done').hidden = false;
        $('doneMsg').textContent = 'شناسه ثبت: ' + res.id;
        window.scrollTo(0, 0);
      })
      .catch(() => fail('ارتباط با سرور برقرار نشد'));
  });

  /* ---------- تغییر رمز ---------- */
  $('chgBtn').addEventListener('click', () => {
    const msg = $('chgMsg'), btn = $('chgBtn');
    const say = (t, cls) => { msg.textContent = t; msg.className = 'msg ' + (cls || ''); };
    const cur = $('curCode').value.trim(), nw = $('newCode').value.trim(), nw2 = $('newCode2').value.trim();
    if (nw.length < 6) { say('رمز جدید باید حداقل ۶ کاراکتر باشد', 'bad'); return; }
    if (nw !== nw2) { say('تکرار رمز با رمز جدید یکی نیست', 'bad'); return; }
    if (API_URL.indexOf('http') !== 0) { say('آدرس API در فایل تنظیم نشده است', 'bad'); return; }
    btn.disabled = true; say('در حال ذخیره…');
    fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'changeCode', accessCode: cur, newCode: nw })
    })
      .then(r => r.json())
      .then(res => {
        btn.disabled = false;
        if (!res.ok) { say(res.error || 'خطا در تغییر رمز', 'bad'); return; }
        try { localStorage.setItem('accessCode', nw); } catch (e) {}
        $('accessCode').value = nw;
        $('curCode').value = ''; $('newCode').value = ''; $('newCode2').value = '';
        say('رمز تغییر کرد. در سایر دستگاه‌ها باید رمز جدید را وارد کنید.', 'good');
      })
      .catch(() => { btn.disabled = false; say('ارتباط با سرور برقرار نشد', 'bad'); });
  });

  $('again').addEventListener('click', () => {
    const ac = $('accessCode').value; $('form').reset(); $('accessCode').value = ac; $('installDate').value = todayJalali();
    state.capacity = ''; state.model = ''; state.photos = {};
    renderCaps(); renderModels(); renderPhotos();
    $('form').hidden = false; $('bar').hidden = false; $('done').hidden = true;
    window.scrollTo(0, 0);
  });
})();
</script>
</body>
</html>
